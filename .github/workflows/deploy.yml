name: CloudLedger CD Deployment Pipeline

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: 'Terraform Action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required for actions/checkout

jobs:
  deploy-infrastructure:
    name: Provision AWS Infrastructure (Terraform)
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.0'

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Terraform Plan
        run: |
          terraform -chdir=terraform plan \
            -var="environment=${{ inputs.target_environment }}" \
            -var="db_password=${{ secrets.DB_MASTER_PASSWORD }}" \
            -out=tfplan

      - name: Terraform Apply (Controlled Gate)
        if: ${{ inputs.action == 'apply' }}
        run: terraform -chdir=terraform apply -auto-approve tfplan
