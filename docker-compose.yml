services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudledger-postgres
    restart: always
    environment:
      POSTGRES_USER: cloudledger
      POSTGRES_PASSWORD: cloudledger_secure_password_2026
      POSTGRES_DB: cloudledger_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudledger -d cloudledger_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cloudledger-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://cloudledger:cloudledger_secure_password_2026@postgres:5432/cloudledger_db
      MOCK_AWS: "true"
      AWS_REGION: "us-east-1"
      JWT_SECRET: "cloudledger-super-secure-production-secret-key-32chars"
      DEFAULT_ADMIN_EMAIL: "admin@cloudledger.edu"
      DEFAULT_ADMIN_PASSWORD: "Admin@CloudLedger2026"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cloudledger-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
